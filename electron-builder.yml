appId: com.hanzi.explorer
productName: 汉字小探险
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources: []
asar: true
electronDist: node_modules/electron/dist
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
win:
  signAndEditExecutable: false
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
